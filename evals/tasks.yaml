# Tareas de evaluación sobre playground/. Cada tarea se ejecuta en una COPIA limpia.
# check.command: se ejecuta tras el agente en el workdir (exit 0 = aprobado)
# check.hidden:  tests ocultos que se copian al workdir SOLO para corregir
# check.answer_contains: la respuesta final debe contener todos estos textos (sin mayúsculas/acentos)
- id: fix_redondeo
  prompt: "Hay facturas con IVA que salen con un céntimo de menos. Encuentra la causa y arréglala. Los tests deben pasar."
  check: {command: "python -m pytest -q tests/test_importes.py"}

- id: fix_vencimiento
  prompt: "Si el vencimiento de una factura cae en domingo no se traslada al lunes. Arréglalo."
  check: {command: "python -m pytest -q tests/test_fechas.py"}

- id: suite_verde
  prompt: "Haz que pase toda la suite de tests (python -m pytest -q) sin modificar los tests."
  check: {command: "python -m pytest -q"}

- id: feature_descuento
  prompt: "Añade a Factura.total() un parámetro opcional descuento (porcentaje 0-100, por defecto 0) que se aplica a la base ANTES del IVA. Si está fuera de rango, ValueError. Añade un test."
  check: {command: "python -m pytest -q tests/test_descuento_oculto.py", hidden: {"evals/hidden/test_descuento.py": "tests/test_descuento_oculto.py"}}

- id: pregunta_iva
  prompt: "Sin modificar nada: ¿en qué fichero y función se calcula la cuota de IVA y qué tipos admite?"
  check: {answer_contains: ["importes.py", "calcular_iva", "21", "10", "4"], forbid_changes: true}
