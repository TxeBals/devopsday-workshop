[project]
name = "forja"
version = "1.0.0"
description = "Workshop: construye tu propio agente de código (tipo Claude Code / OpenCode) con modelos abiertos en local"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",       # solo como cliente HTTP OpenAI-compatible (Ollama, vLLM, LM Studio, OpenRouter)
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13",
  "pyyaml>=6",
  "mcp>=1.2",           # compatible 1.x y 2.x
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forja = "forja.cli:main"

[tool.setuptools]
packages = ["forja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
